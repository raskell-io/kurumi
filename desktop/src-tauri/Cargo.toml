[package]
name = "kurumi"
version = "0.0.0" # the app version comes from the root package.json (tauri.conf.json)
description = "Kurumi desktop app"
authors = ["Raffael Schneider"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "kurumi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-notification = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only: phones have one instance anyway.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
