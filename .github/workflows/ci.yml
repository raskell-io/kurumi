name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Svelte check (0 errors, 0 warnings)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  browser:
    # Headless Chrome against `vite dev` (e2e/smoke.mjs), then against a
    # production build with the service worker (e2e/pwa.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Also downloads puppeteer's Chrome.
      - run: npm ci

      # A real (virtual) display: headless Chrome on Linux reports no mouse,
      # so (hover: hover) is false and hover-only UI never shows. 1920x1080
      # fits the tests' 1400x900 pages; xvfb's 640x480 default puts clicks
      # off-screen.
      - name: Browser tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:e2e
        env:
          HEADFUL: 1

      - name: Installed-app (PWA) tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" npm run test:pwa
        env:
          HEADFUL: 1
