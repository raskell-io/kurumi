name: Desktop apps

# Builds the Electron apps (desktop/) for macOS, Windows and Linux. A version
# tag (vX.Y.Z) attaches them to that tag's GitHub release; a manual run only
# keeps them as workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/

  package:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            files: desktop/dist/*.dmg
          - os: windows-latest
            files: desktop/dist/*.exe
          - os: ubuntu-latest
            files: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/

      - run: npm ci
        working-directory: desktop

      - run: npm run dist
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | | File |
            |---|---|
            | Mac (Apple Silicon) | `Kurumi-*-mac-arm64.dmg` |
            | Mac (Intel) | `Kurumi-*-mac-x64.dmg` |
            | Windows | `Kurumi-*-win-x64.exe` |
            | Linux | the `.AppImage` |

            The builds aren't signed yet:
            - **Mac:** open the app once, then System Settings → Privacy & Security → *Open Anyway*.
            - **Windows:** SmartScreen warns; choose *More info* → *Run anyway*.

            The desktop app keeps its own notes, separate from the browser's. Use sync or a backup to move them over. Kurumi also runs at https://kurumi.raskell.io.
