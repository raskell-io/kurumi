name: Desktop apps

# Builds the Tauri apps (desktop/) for macOS, Windows and Linux and runs the
# self-test (desktop/selftest.mjs) on each. A version tag (vX.Y.Z) attaches
# them to that tag's GitHub release; other runs keep them as artifacts.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/lib/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/

  package:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            exe: desktop/src-tauri/target/universal-apple-darwin/release/kurumi
            files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis
            exe: desktop/src-tauri/target/release/kurumi.exe
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            args: --bundles appimage
            exe: desktop/src-tauri/target/release/kurumi
            files: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/

      - run: npm ci
        working-directory: desktop

      - name: Rust tests
        run: cargo test
        working-directory: desktop/src-tauri

      - name: Build
        run: npm run dist -- ${{ matrix.args }}
        working-directory: desktop

      - name: Self-test
        shell: bash
        run: |
          export KURUMI_EXE="$GITHUB_WORKSPACE/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node desktop/selftest.mjs; else node desktop/selftest.mjs; fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | | File |
            |---|---|
            | Mac (Apple Silicon and Intel) | `Kurumi_*_universal.dmg` |
            | Windows | `Kurumi_*_x64-setup.exe` |
            | Linux | `Kurumi_*_amd64.AppImage` |

            The builds aren't signed yet:
            - **Mac:** open the app once, then System Settings → Privacy & Security → *Open Anyway*.
            - **Windows:** SmartScreen warns; choose *More info* → *Run anyway*.

            The desktop app keeps its own notes, separate from the browser's. Use sync or a backup to move them over. Kurumi also runs at https://kurumi.raskell.io.
