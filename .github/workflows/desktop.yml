name: Desktop apps

# Builds the Tauri apps (desktop/) for macOS, Windows and Linux and runs the
# self-test (desktop/selftest.mjs) on each. A version tag (vX.Y.Z) attaches
# them to that tag's GitHub release; other runs keep them as artifacts.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/lib/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/

  package:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            exe: desktop/src-tauri/target/universal-apple-darwin/release/kurumi
            files: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            args: --bundles nsis
            exe: desktop/src-tauri/target/release/kurumi.exe
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            args: --bundles appimage
            exe: desktop/src-tauri/target/release/kurumi
            files: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xvfb

      - uses: actions/download-artifact@v4
        with:
          name: web
          path: build/

      - run: npm ci
        working-directory: desktop

      - name: Rust tests
        run: cargo test
        working-directory: desktop/src-tauri

      # Developer ID signing and notarization, once the secrets are set
      # (desktop/README.md → Signing). Without them the app is ad-hoc signed.
      # Only set variables are exported: Tauri treats an empty one as set.
      - name: macOS signing setup
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::notice::No Developer ID secrets: the Mac app is ad-hoc signed."
            exit 0
          fi
          if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::APPLE_CERTIFICATE is set but the notarization secrets (APPLE_API_KEY, APPLE_API_ISSUER, APPLE_API_KEY_P8) aren't: a signed app that isn't notarized is still blocked."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          printf '{"bundle":{"macOS":{"signingIdentity":%s}}}' "$(jq -Rn --arg v "$APPLE_SIGNING_IDENTITY" '$v')" > "$RUNNER_TEMP/signing.json"
          {
            echo "APPLE_CERTIFICATE<<KURUMI_EOF"
            echo "$APPLE_CERTIFICATE"
            echo "KURUMI_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key"
            echo "SIGN_ARGS=--config $RUNNER_TEMP/signing.json"
            echo "MAC_SIGNED=1"
          } >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: npm run dist -- ${{ matrix.args }} $SIGN_ARGS
        working-directory: desktop

      - name: Check signature and notarization
        if: runner.os == 'macOS' && env.MAC_SIGNED == '1'
        shell: bash
        run: |
          app=desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Kurumi.app
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Self-test
        shell: bash
        run: |
          export KURUMI_EXE="$GITHUB_WORKSPACE/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node desktop/selftest.mjs; else node desktop/selftest.mjs; fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist/

      # The first-launch steps are only listed for what isn't signed.
      - name: Release notes
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          {
            echo '## Download'
            echo
            echo '| | File |'
            echo '|---|---|'
            echo '| Mac (Apple Silicon and Intel) | `Kurumi_*_universal.dmg` |'
            echo '| Windows | `Kurumi_*_x64-setup.exe` |'
            echo '| Linux | `Kurumi_*_amd64.AppImage` |'
            echo
            if [ "$MAC_SIGNED" = true ]; then
              echo 'The Mac app is signed and notarized. The Windows installer isn'"'"'t signed yet: SmartScreen warns; choose *More info* → *Run anyway*.'
            else
              echo 'The builds aren'"'"'t signed yet:'
              echo '- **Mac:** open the app once, then System Settings → Privacy & Security → *Open Anyway*.'
              echo '- **Windows:** SmartScreen warns; choose *More info* → *Run anyway*.'
            fi
            echo
            echo 'The desktop app keeps its own notes, separate from the browser'"'"'s. Use sync or a backup to move them over. Kurumi also runs at https://kurumi.raskell.io.'
          } > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: notes.md
